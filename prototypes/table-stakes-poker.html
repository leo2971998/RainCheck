<script type="text/babel" data-presets="react">

const APP = 'Table Stakes';

/* =============== sample household (Nessie would supply the records) =============== */

const NOTICE = `From: Northline Internet <billing@northline.example>
Subject: Your October bill

Hi Alex,

Your Internet 300 plan will renew at $90.00 starting with your October 1 bill.
Your 12-month promotional credit of $25.00 ended on September 30.
Your speed and service are unchanged.

Questions? Visit support.northline.example or call the number on your bill.`;
const TRANSACTIONS = [
  { d: 'Sep 26', what: 'Kroger', amt: -84.12, cat: 'Table money' }, { d: 'Sep 25', what: 'Transfer to Savings', amt: -300, cat: 'Chips to the pot', note: 'Your own savings account, not spending' },

/* =============== helpers =============== */
const $ = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const iso = d => d.toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

const long = d => d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
const stateOf = (b, cushion) => b < 0 ? 'busted' : b < cushion ? 'allin' : b < cushion + 100 ? 'short' : 'deep';

const MONTHS = ['October 2026', 'November 2026', 'December 2026', 'January 2027', 'February 2027', 'March 2027', 'April 2027', 'May 2027', 'June 2027', 'July 2027'];
const monthLabel = n => MONTHS[Math.min(MONTHS.length, Math.max(1, n)) - 1];
const FLEX_ORDER = ['takeout', 'fun', 'rides', 'household', 'groceries'];

/* =============== the engine: one day-by-day pass =============== */
function simulate(sc) {
  const income = sc.income || H.income;
  const dailySpend = (H.allowances.reduce((a, x) => a + x.monthly - (sc.cuts?.[x.id] || 0), 0)) / 30;
  const days = []; let b = H.checking;
  for (let i = 0; i < WINDOW; i++) {
    const date = addDays(TODAY, i), key = iso(date), events = [];
    for (const p of income) if (p.date === key) { b += p.amount; events.push({ label: p.label + (p.status === 'estimated' ? ' (estimated)' : ''), amt: p.amount, pay: true }); }
    for (const r of H.recurring) {
      if (date.getDate() !== r.day || sc.cancelled?.[r.id]) continue;
      let amt = r.amount;
      if (r.change && key >= r.change.effective) amt = r.amount + sc.increase;

function capacity(sc) { for (let c = 600; c >= 0; c -= 5) if (simulate({ ...sc, contribution: c }).low.balance >= H.cushion) return c; return 0; }

}

/* =============== icons and suits (SVG, no emoji) =============== */

    case 'cards': return <svg {...p}><rect x="3" y="6" width="12" height="16" rx="2" /><path d="M9 3h10a2 2 0 0 1 2 2v12" /></svg>;
    case 'pot': return <svg {...p}><path d="M4 10h16l-1.5 9a2 2 0 0 1-2 1.7h-9a2 2 0 0 1-2-1.7L4 10z" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>;

    case 'mail': return <svg {...p}><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 6 9-6" /></svg>;
    case 'raise': return <svg {...p}><path d="M12 19V5M6 11l6-6 6 6" /></svg>;
    case 'x': return <svg {...p}><path d="M6 6l12 12M18 6L6 18" /></svg>;

};
const Suit = ({ s, size = 14 }) => {
  const red = s === 'heart' || s === 'diamond';
  const d = { spade: 'M12 2C9 7 5 9 5 13a4 4 0 0 0 7 2.6A4 4 0 0 0 19 13c0-4-4-6-7-11zM11 17h2l1 5h-4z', heart: 'M12 21s-7-4.5-9-9a4.5 4.5 0 0 1 9-2 4.5 4.5 0 0 1 9 2c-2 4.5-9 9-9 9z', diamond: 'M12 2l7 10-7 10-7-10z', club: 'M12 2a4 4 0 0 0-3.5 6A4 4 0 1 0 11 15.5L10 22h4l-1-6.5A4 4 0 1 0 15.5 8 4 4 0 0 0 12 2z' }[s];

const PlayingCard = ({ suit, rank, back }) => (
  <div className={'pcard ' + (back ? 'back' : (suit === 'heart' || suit === 'diamond') ? 'red' : 'black')} aria-hidden="true">
    {!back && <><div className="idx">{rank}<Suit s={suit} size={13} /></div><div className="idx b">{rank}<Suit s={suit} size={13} /></div></>}
  </div>
);
const COLOR = { deep: 'var(--deep)', short: 'var(--short)', allin: 'var(--allin)', busted: 'var(--busted)' };

/* =============== shared pieces =============== */
function Board({ sim, selected, onSelect }) {
  const days = sim.days, max = Math.max(...days.map(d => Math.abs(d.balance)), 1);
  const tag = d => d.events.some(e => e.pay) ? 'PAY' : d.events.some(e => e.rent) ? 'RENT' : d.events.some(e => e.transfer) ? 'POT' : '';
  return (
    <div>
      <div className="board" role="group" aria-label="Chip stack for each of the next 34 days">
        {days.map(d => (
          <button key={d.key} className={'day' + (selected === d.key ? ' sel' : '')} onClick={() => onSelect(d.key)} aria-label={`${long(d.date)}: ${STATE[d.state]}, ${$(d.balance)}`}>
            <span className="t">{tag(d)}</span>
            <span className={'chips ' + d.state} style={{ height: Math.max(3, Math.round(Math.abs(d.balance) / max * 88)) }}></span>
            <span className="n">{d.date.getDate()}</span>
          </button>
        ))}
      </div>
      <div className="baseline"></div>
      <div className="weeks"><span>Sep 28</span><span>Oct 5</span><span>Oct 12</span><span>Oct 19</span><span>Oct 26</span></div>
      <div className="legend" style={{ marginTop: 8 }}>
        <span><i style={{ background: 'var(--deep)' }}></i>Deep stack</span><span><i style={{ background: 'var(--short)' }}></i>Short stack (within $100 of the minimum)</span><span><i style={{ background: 'var(--allin)' }}></i>All in (below the {$(H.cushion)} table minimum)</span><span><i style={{ background: 'var(--busted)' }}></i>Busted (below zero)</span>
      </div>
    </div>
  );
}
function DayDetail({ sim, dayKey }) {
  const d = sim.days.find(x => x.key === dayKey); if (!d) return null;
  const morning = d.balance - d.events.reduce((a, e) => a + e.amt, 0);
  return (
    <div className="callout" style={{ flexDirection: 'column', gap: 6 }}>
      <div className="row between"><strong>{long(d.date)}</strong><span className={'pill ' + d.state}>{STATE[d.state]}</span></div>
      <div className="row between" style={{ opacity: .8 }}><span>Stack that morning</span><span className="num">{$(morning)}</span></div>
      {d.events.map((e, i) => <div className="row between" key={i}><span>{e.label}</span><span className="num" style={{ color: e.amt > 0 ? 'var(--gold)' : undefined }}>{e.amt > 0 ? '+' : ''}{$(e.amt)}</span></div>)}
      <div className="row between" style={{ fontWeight: 700 }}><span>End of day</span><span className="num">{$(d.balance)}</span></div>
    </div>
  );
}
function PotBar({ saved, projected, target }) {
  return <div className="bar" role="img" aria-label={`${$(saved)} in the pot, ${$(projected)} projected, of ${$(target)}`}><i className="proj" style={{ width: Math.min(100, projected / target * 100) + '%' }}></i><i style={{ width: Math.min(100, saved / target * 100) + '%' }}></i></div>;
}
function Toggle({ on, onChange, children }) {
  return <label className={'toggle' + (on ? ' on' : '')}><input type="checkbox" checked={on} onChange={e => onChange(e.target.checked)} style={{ position: 'absolute', opacity: 0, width: 1, height: 1 }} /><i></i>{children}</label>;
}

/* =============== pages =============== */

function OutsPanel({ sc, cap, onApply, onClose }) {
  const [pick, setPick] = useState('call');
  const [off, setOff] = useState({ groceries: true });
  const base = goalAt(cap);
  const candidates = H.allowances.filter(a => !off[a.id]).sort((a, b) => FLEX_ORDER.indexOf(a.id) - FLEX_ORDER.indexOf(b.id));
  let fold = null; for (const a of candidates) { const cut = cutNeeded(sc, a.id, H.goal.planned); if (cut !== null && cut <= a.monthly) { fold = { a, cut }; break; } }
  const gym = H.recurring.find(r => r.id === 'gym'); const capNoGym = capacity({ ...sc, cancelled: { ...sc.cancelled, gym: true } });
  const later = base.monthsNeeded;
  const options = [
    { id: 'call', move: 'Call', title: 'Call the raise', p: `Pay the new blind and buy in ${$(cap)} a month instead of ${$(H.goal.planned)}.`, before: { k: 'Pot by ' + H.goal.targetLabel, v: $(H.goal.target) }, after: { k: 'Pot by ' + H.goal.targetLabel, v: $(base.projected), note: base.gap ? `${$(base.gap)} short` : 'on target' }, extra: `Your stack never drops below the ${$(H.cushion)} table minimum.`, apply: { contribution: cap, label: `Buy-in set to ${$(cap)}/month` } },
    fold ? { id: 'fold', move: 'Fold', title: `Fold ${$(fold.cut)} of ${fold.a.label.toLowerCase()} a month`, p: `${$(fold.a.monthly)} → ${$(fold.a.monthly - fold.cut)}. Keeps the ${$(H.goal.planned)} buy-in.`, before: { k: fold.a.label, v: $(fold.a.monthly) + '/mo' }, after: { k: 'Buy-in', v: $(H.goal.planned), note: 'pot on target' }, extra: 'Only table money you have not put off limits is offered.', apply: { cuts: { [fold.a.id]: fold.cut }, contribution: H.goal.planned, label: `${fold.a.label} folded ${$(fold.cut)}/month` } }
      : { id: 'fold', move: 'Fold', title: 'Fold some table money', p: 'Everything is off limits, so there is nothing to fold. Put one allowance back in play to see this out.', disabled: true },
    { id: 'check', move: 'Check', title: `Check the ${gym.label.toLowerCase()} renewal (${$(gym.amount)} on Oct 15)`, p: `If it is cancelled before it charges, the table supports a ${$(capNoGym)} buy-in.`, before: { k: 'Buy-in', v: $(cap) }, after: { k: 'Buy-in', v: $(Math.min(capNoGym, H.goal.planned)), note: 'if cancelled' }, extra: 'A scenario until the provider confirms the cancellation.', conditional: true, apply: { cancelled: { gym: true }, contribution: Math.min(capNoGym, H.goal.planned), label: 'Gym cancellation pending confirmation' } },
    { id: 'session', move: 'Play on', title: 'Play a longer session', p: isFinite(later) ? `Keep the ${$(cap)} buy-in and fill the ${$(H.goal.target)} pot after ${later} buy-ins instead of ${H.goal.left}.` : 'The table cannot support a buy-in right now, so no date works yet.', before: { k: 'Pot full by', v: H.goal.targetLabel }, after: { k: 'Pot full by', v: isFinite(later) ? monthLabel(later) : '—', note: isFinite(later) ? `${later - H.goal.left} month${later - H.goal.left === 1 ? '' : 's'} later` : '' }, extra: 'Nothing else changes.', disabled: !isFinite(later), apply: { contribution: cap, label: `Pot target moved to ${isFinite(later) ? monthLabel(later) : '—'}` } },
  ];
  const chosen = options.find(o => o.id === pick);
  return (
    <div className="card">
      <div className="row between"><h2>Your outs</h2><button className="btn ghost sm" onClick={onClose} aria-label="Close"><Icon name="x" size={16} /></button></div>
      <p style={{ margin: 0 }}>The {$(sc.increase)} raise leaves the pot <b className="num">{base.gap ? $(base.gap) : '$0'}</b> short of {$(H.goal.target)}. Pick a play and preview it. No chips move until you lock it in.</p>
      <div className="row wrap" style={{ gap: 12 }}><span className="label">Off limits</span>{H.allowances.map(a => <Toggle key={a.id} on={!!off[a.id]} onChange={v => setOff(p => ({ ...p, [a.id]: v }))}>{a.label} {$(a.monthly)}</Toggle>)}</div>
      {options.map(o => (
        <div key={o.id} className={'option' + (pick === o.id ? ' on' : '')} style={{ opacity: o.disabled ? .6 : 1 }}>
          <div className="row between"><span className="move">{o.move}</span>{o.conditional && <span className="pill neutral">Conditional</span>}</div>
          <h3>{o.title}</h3><p>{o.p}</p>
          {!o.disabled && <div className="ba"><div><span className="k">Before · {o.before.k}</span><b>{o.before.v}</b></div><div><span className="k">After · {o.after.k}</span><b>{o.after.v}</b><span className="fine">{o.after.note}</span></div></div>}
          {!o.disabled && <div className="row between"><span className="fine">{o.extra}</span><button className={'btn sm' + (pick === o.id ? '' : ' ghost')} onClick={() => setPick(o.id)}>{pick === o.id ? 'Selected' : 'Preview'}</button></div>}
        </div>
      ))}
      <div className="callout"><Icon name="chip" size={18} /><span>No out hides a cost. Pulling chips out of the pot would fix your stack but shrink the pot, so it is not offered here.</span></div>
      <button className="btn" disabled={!chosen || chosen.disabled} onClick={() => onApply(chosen)}>Lock in this play <Icon name="arrow" size={16} /></button>
    </div>
  );
}

                <span className={'pill ' + (t.review ? 'gold' : 'neutral')}>{t.review ? 'Second look' : t.cat}</span>
                <span className={'amt num' + (t.amt > 0 ? ' in' : '')}>{t.amt > 0 ? '+' : ''}{$(t.amt)}</span>
                {t.review && <button className="btn ghost sm">Correct</button>}
              </div>
            ))}
          </div>
        </div>
      )}
      {tab === 'blinds' && (
        <div className="card">
          <div className="row between"><h2>Blinds</h2><span className="fine"><Suit s="spade" /> must post on the day · <Suit s="club" /> can be moved or cancelled · <Suit s="diamond" /> raised</span></div>
          <table>
            <thead><tr><th>Blind</th><th>Next</th><th className="r">Amount</th><th>Status</th><th></th></tr></thead>
            <tbody>
              {H.recurring.map(r => (
                <tr key={r.id}>
                  <td><span className="row" style={{ gap: 8 }}><Suit s={suitFor(r)} size={15} /><strong>{r.label}</strong></span></td>
                  <td>Oct {r.day}</td>
                  <td className="r">{r.change ? <>{$(r.amount)} → <b>{$(r.amount + sc.increase)}</b></> : r.id === 'electric' && sc.treatElectricAsNew ? <b>{$(r.lastPosted)}</b> : $(r.amount)}{sc.cancelled?.[r.id] && <span className="fine"> · cancel pending</span>}</td>
                  <td>{r.change ? <span className="pill raise">Raised, from a notice</span> : r.unexplained ? <span className="pill short">Posted {$(r.lastPosted)} in Sep · not confirmed why</span> : <span className="pill neutral">Steady</span>}</td>
                  <td className="r">{r.unexplained && <div className="row" style={{ justifyContent: 'flex-end', gap: 6 }}>
                    <button className={'btn sm' + (sc.treatElectricAsNew ? ' ghost' : '')} onClick={() => setSc(s => ({ ...s, treatElectricAsNew: false }))}>One-time</button>
                    <button className={'btn sm' + (sc.treatElectricAsNew ? '' : ' ghost')} onClick={() => setSc(s => ({ ...s, treatElectricAsNew: true }))}>New price</button></div>}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="fine">"The amount changed. We have not confirmed why." is an honest state. Your correction re-deals the table immediately.</div>
        </div>
      )}
      {tab === 'money' && (
        <div className="card">
          <h2>Table money</h2>
          <div className="fine">Monthly amounts learned from three months of spending. {APP} spreads them across the days of the forecast.</div>
          <table><thead><tr><th>Allowance</th><th className="r">Monthly</th><th className="r">This plan</th></tr></thead>
            <tbody>{H.allowances.map(a => <tr key={a.id}><td>{a.label}</td><td className="r">{$(a.monthly)}</td><td className="r">{sc.cuts?.[a.id] ? <b>{$(a.monthly - sc.cuts[a.id])}</b> : $(a.monthly)}</td></tr>)}</tbody></table>
        </div>
      )}
    </>
  );
}

/* =============== app shell =============== */
function App() {
  const [page, setPage] = useState('table');
  const [panel, setPanel] = useState(null);         // 'raise' | 'outs' | null
  const [sc, setSc] = useState({ increase: 25, contribution: 300, cuts: {}, cancelled: {} });
  const [confirm, setConfirm] = useState(null);
  const [applied, setApplied] = useState(null);
  const [found, setFound] = useState(true);

  const sim = useMemo(() => simulate(sc), [sc]);
  const cap = useMemo(() => capacity(sc), [sc]);
  const goal = useMemo(() => { const c = applied ? sc.contribution : cap; const g = goalAt(c); return applied?.id === 'session' && isFinite(g.monthsNeeded) ? goalAt(c, g.monthsNeeded) : g; }, [sc, cap, applied]);

  const tells = useMemo(() => {
    const a = []; const planFits = sc.contribution <= cap; const g = goalAt(cap);
    if (sc.increase > 0 && !applied) a.push({
      title: `Internet raised you ${$(sc.increase)} a month.`,
      body: `${!planFits ? `Your planned ${$(sc.contribution)} buy-in would leave ${$(sim.low.balance)} on ${pretty(sim.low.date)}, below the ${$(H.cushion)} table minimum. ` : ''}${g.gap ? `The pot would end ${$(g.gap)} short. ` : ''}See your outs.`,
      action: { label: 'See your outs', go: () => { setPage('table'); setPanel('outs'); } },
    });
    if (sim.worst === 'busted' || sim.worst === 'allin') a.push({ title: `Your stack falls to ${$(sim.low.balance)} on ${pretty(sim.low.date)}.`, body: `That is below the ${$(H.cushion)} table minimum before the next payout.` });
    return a;
  }, [sc, cap, sim, applied]);

  const go = ({ page: p, panel: pn }) => { if (p) setPage(p); if (pn !== undefined) setPanel(pn); };
  const reallyApply = () => { setSc(s => ({ ...s, ...confirm.apply, cuts: { ...s.cuts, ...(confirm.apply.cuts || {}) }, cancelled: { ...s.cancelled, ...(confirm.apply.cancelled || {}) } })); setApplied({ id: confirm.id, label: confirm.apply.label }); setConfirm(null); setPanel(null); };

  return (
    <div className="room">
      <header className="marquee">
        <div><h1>{APP}</h1><div className="tag">Cover your table stakes. Play the rest. Blinds, raises, outs and the pot, from your real transactions.</div></div>
        <nav className="tabs" aria-label="Main">
          {[['table', 'The table', 'chip'], ['hand', 'Your hand', 'cards'], ['pot', 'The pot', 'pot']].map(([id, label, ic]) => <button key={id} className={'tab' + (page === id ? ' on' : '')} onClick={() => setPage(id)}><Icon name={ic} size={18} />{label}</button>)}
        </nav>
      </header>
      <main className="table">
        {page === 'table' && (panel ? (
          <div className="cols">
            <div className="stack">
              <button className="link" onClick={() => setPanel(null)} style={{ alignSelf: 'flex-start' }}>← Back to the table</button>
              {panel === 'raise' && <RaisePanel sc={sc} setSc={setSc} cap={cap} goal={goalAt(cap)} onOuts={() => setPanel('outs')} onClose={() => setPanel(null)} />}
              {panel === 'outs' && <OutsPanel sc={sc} cap={cap} onApply={o => setConfirm(o)} onClose={() => setPanel(null)} />}
            </div>
            <div className="stack">
              <section className="hero">
                <div className="row between wrap"><span className={'pill ' + sim.worst}><Icon name="chip" size={13} />Current plan · {$(sc.contribution)} buy-in</span><span className="fine">Lowest stack {$(sim.low.balance)} on {pretty(sim.low.date)}</span></div>
                <Board sim={sim} selected={null} onSelect={() => {}} />
              </section>
              <div className="card"><h2>The pot</h2><PotBar saved={H.goal.saved} projected={goalAt(cap).projected} target={H.goal.target} /><div className="fine">Projected {$(goalAt(cap).projected)} of {$(H.goal.target)} at a {$(cap)} buy-in. Your stack stays at {$(H.savings)} until a transfer completes.</div></div>
            </div>
          </div>
        ) : <TablePage sc={sc} setSc={setSc} sim={sim} cap={cap} goal={goal} tells={tells} go={go} applied={applied} found={found} setFound={setFound} />)}
        {page === 'pot' && <PotPage sc={sc} cap={cap} goal={goal} applied={applied} go={go} />}
        {page === 'hand' && <HandPage sc={sc} setSc={setSc} />}
        <div className="fine" style={{ marginTop: 22 }}>Sample household. Estimates use scheduled blinds and typical daily table money from bank history. {APP} never moves chips on its own.</div>
      </main>
      {confirm && (
        <div className="sheet-bg" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
          <div className="sheet">
            <div className="row" style={{ gap: 12 }}><PlayingCard back /><h2 id="confirm-title">Lock in this play?</h2></div>
            <div className="option on"><span className="move">{confirm.move}</span><h3>{confirm.title}</h3><p>{confirm.p}</p></div>
            <div className="callout"><Icon name="chip" size={18} /><span>This updates your plan. It does not move chips. Your stack stays at {$(H.savings)} until you push a buy-in into the pot on the Pot page.</span></div>
            <div className="row" style={{ gap: 8 }}><button className="btn felt" onClick={reallyApply}><Icon name="check" size={16} />Lock it in</button><button className="btn ghost" onClick={() => setConfirm(null)}>Cancel</button></div>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
