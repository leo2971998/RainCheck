<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

/* =============== sample household (Nessie would supply the records) =============== */
const TODAY = new Date(2026, 8, 28);           // Monday, September 28, 2026
const WINDOW = 34;                              // through October 31
const H = {
  checking: 1260, savings: 800, cushion: 200,
  income: [
    { id: 'p1', label: 'Paycheck', date: '2026-10-02', amount: 1700, status: 'confirmed' },
    { id: 'p2', label: 'Paycheck', date: '2026-10-16', amount: 1700, status: 'estimated' },
    { id: 'p3', label: 'Paycheck', date: '2026-10-30', amount: 1700, status: 'estimated' },
  ],
  recurring: [
    { id: 'rent', label: 'Rent', amount: 1150, day: 5 },
    { id: 'internet', label: 'Internet', amount: 65, day: 1, change: { to: 90, effective: '2026-10-01', why: 'Promotional credit ended', source: 'notice' } },
    { id: 'streaming', label: 'Streaming', amount: 30, day: 3, cancellable: true },
    { id: 'electric', label: 'Electric', amount: 110, day: 6, lastPosted: 128, unexplained: true },
    { id: 'car', label: 'Car insurance', amount: 120, day: 10 },
    { id: 'phone', label: 'Phone', amount: 45, day: 12 },
    { id: 'gym', label: 'Gym', amount: 40, day: 15, renews: '2026-10-15', cancellable: true },
  ],
  allowances: [
    { id: 'groceries', label: 'Groceries', monthly: 700 }, { id: 'takeout', label: 'Takeout', monthly: 180 }, { id: 'rides', label: 'Rides', monthly: 60 },
    { id: 'household', label: 'Household', monthly: 260 }, { id: 'fun', label: 'Fun & other', monthly: 300 },
  ],
  goal: { label: 'Emergency fund', target: 2000, saved: 800, left: 4, planned: 300, targetLabel: 'January 2027', months: ['Oct 2', 'Nov 2', 'Dec 2', 'Jan 4'] },
};
const NOTICE = `From: Northline Internet <billing@northline.example>
Subject: Your October bill

Hi Alex,

Your Internet 300 plan will renew at $90.00 starting with your October 1 bill.
Your 12-month promotional credit of $25.00 ended on September 30.
Your speed and service are unchanged.

Questions? Visit support.northline.example or call the number on your bill.`;
const TRANSACTIONS = [
  { d: 'Sep 26', what: 'Kroger', amt: -84.12, cat: 'Everyday' }, { d: 'Sep 25', what: 'Transfer to Savings', amt: -300, cat: 'Transfer', note: 'Your own savings account, not spending' },
  { d: 'Sep 24', what: 'Uber', amt: -18.4, cat: 'Everyday', note: '4th ride this month. Not treated as a subscription.' }, { d: 'Sep 22', what: 'Amazon', amt: -48.3, cat: 'Everyday', review: 'Matches the receipt you forwarded. Counted once.' },
  { d: 'Sep 18', what: 'Paycheck · Rice Coffee Co', amt: 1700, cat: 'Income' }, { d: 'Sep 15', what: 'Gym', amt: -40, cat: 'Recurring' },
  { d: 'Sep 12', what: 'Phone', amt: -45, cat: 'Recurring' }, { d: 'Sep 10', what: 'Car insurance', amt: -120, cat: 'Recurring' },
  { d: 'Sep 8', what: 'Venmo from Sam', amt: 60, cat: 'Transfer', review: 'Money back from a friend, or income?' }, { d: 'Sep 6', what: 'Electric', amt: -128, cat: 'Recurring', note: 'Higher than usual ($110). Not confirmed why.' },
  { d: 'Sep 5', what: 'Rent', amt: -1150, cat: 'Recurring' }, { d: 'Sep 3', what: 'Streaming', amt: -30, cat: 'Recurring' },
];

/* =============== helpers =============== */
const $ = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const iso = d => d.toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const pretty = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const long = d => d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
const stateOf = (b, cushion) => b < 0 ? 'storm' : b < cushion ? 'rain' : b < cushion + 100 ? 'cloudy' : 'clear';
const STATE_WORD = { clear: 'Clear', cloudy: 'Cloudy', rain: 'Rain', storm: 'Storm' };

/* =============== the engine: one day-by-day pass =============== */
// sc = scenario: { increase, contribution, cuts:{allowanceId: monthly$}, cancelled:{id:true}, treatElectricAsNew, income:[...] }
function simulate(sc) {
  const income = sc.income || H.income;
  const dailySpend = (H.allowances.reduce((a, x) => a + x.monthly - (sc.cuts?.[x.id] || 0), 0)) / 30;
  const days = []; let b = H.checking;
  for (let i = 0; i < WINDOW; i++) {
    const date = addDays(TODAY, i), key = iso(date), events = [];
    for (const p of income) if (p.date === key) { b += p.amount; events.push({ label: p.label + (p.status === 'estimated' ? ' (estimated)' : ''), amt: p.amount }); }
    for (const r of H.recurring) {
      if (date.getDate() !== r.day || sc.cancelled?.[r.id]) continue;
      let amt = r.amount;
      if (r.change && key >= r.change.effective) amt = r.amount + sc.increase;
      if (r.id === 'electric' && sc.treatElectricAsNew) amt = r.lastPosted;
      b -= amt; events.push({ label: r.label, amt: -amt });
    }
    if (key === '2026-10-02' && sc.contribution > 0) { b -= sc.contribution; events.push({ label: 'Savings contribution', amt: -sc.contribution, transfer: true }); }
    b -= dailySpend; events.push({ label: 'Everyday spending', amt: -dailySpend });
    days.push({ date, key, balance: b, events, state: stateOf(b, H.cushion) });
  }
  const low = days.reduce((a, x) => (x.balance < a.balance ? x : a));
  const worst = ['storm', 'rain', 'cloudy', 'clear'].find(s => days.some(d => d.state === s));
  return { days, low, worst, dailySpend };
}
// largest contribution (in $5 steps) that keeps every day at or above the cushion
function capacity(sc) {
  for (let c = 600; c >= 0; c -= 5) if (simulate({ ...sc, contribution: c }).low.balance >= H.cushion) return c;
  return 0;
}
const MONTHS = ['October 2026', 'November 2026', 'December 2026', 'January 2027', 'February 2027', 'March 2027', 'April 2027', 'May 2027', 'June 2027', 'July 2027'];
const monthLabel = n => MONTHS[Math.min(MONTHS.length, Math.max(1, n)) - 1];
function goalAt(c, left = H.goal.left) {
  const projected = H.goal.saved + left * c, gap = Math.max(0, H.goal.target - projected);
  const monthsNeeded = c > 0 ? Math.ceil((H.goal.target - H.goal.saved) / c) : Infinity;
  return { projected, gap, monthsNeeded, contributions: left * c, left, targetLabel: monthLabel(left) };
}
const FLEX_ORDER = ['takeout', 'fun', 'rides', 'household', 'groceries'];
// the smallest monthly cut to one allowance that restores the planned contribution
function cutNeeded(sc, allowanceId, want) {
  for (let cut = 0; cut <= 400; cut += 5) if (capacity({ ...sc, cuts: { ...sc.cuts, [allowanceId]: cut } }) >= want) return cut;
  return null;
}

/* =============== icons (stroke SVG, no emoji) =============== */
const Icon = ({ name, size = 18, color = 'currentColor' }) => {
  const p = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' };
  switch (name) {
    case 'sun': return <svg {...p}><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>;
    case 'cloud': return <svg {...p}><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.1 9.6 4.25 4.25 0 0 0 7 18z" /></svg>;
    case 'rain': return <svg {...p}><path d="M7 15h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.1 6.6 4.25 4.25 0 0 0 7 15z" /><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3" /></svg>;
    case 'storm': return <svg {...p}><path d="M7 14h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.1 5.6 4.25 4.25 0 0 0 7 14z" /><path d="M13 14l-2.5 4H14l-2.5 4" /></svg>;
    case 'forecast': return <svg {...p}><path d="M3 17l5-6 4 4 5-8 4 5" /></svg>;
    case 'activity': return <svg {...p}><path d="M4 6h16M4 12h16M4 18h10" /></svg>;
    case 'goal': return <svg {...p}><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="4" /><path d="M12 3v2M12 19v2" /></svg>;
    case 'umbrella': return <svg {...p}><path d="M12 3a9 9 0 0 1 9 9H3a9 9 0 0 1 9-9z" /><path d="M12 12v6a2 2 0 0 0 4 0" /></svg>;
    case 'arrow': return <svg {...p}><path d="M5 12h14M13 6l6 6-6 6" /></svg>;
    case 'back': return <svg {...p}><path d="M15 5l-7 7 7 7" /></svg>;
    case 'check': return <svg {...p}><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>;
    case 'bell': return <svg {...p}><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4l2-2zM10 20a2 2 0 0 0 4 0" /></svg>;
    case 'mail': return <svg {...p}><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 6 9-6" /></svg>;
    case 'x': return <svg {...p}><path d="M6 6l12 12M18 6L6 18" /></svg>;
    default: return null;
  }
};
const ICON_FOR = { clear: 'sun', cloudy: 'cloud', rain: 'rain', storm: 'storm' };
const COLOR_FOR = { clear: 'var(--clear)', cloudy: 'var(--cloudy)', rain: 'var(--rain)', storm: 'var(--storm)' };

/* =============== shared pieces =============== */
function Strip({ sim, selected, onSelect }) {
  const days = sim.days;
  return (
    <div>
      <div className="strip" role="group" aria-label="Daily forecast">
        {days.map(d => {
          const hot = d.events.some(e => e.transfer || Math.abs(e.amt) >= 100);
          return (
            <button key={d.key} className={'day ' + d.state + (selected === d.key ? ' sel' : '')} onClick={() => onSelect(d.key)}
              aria-label={`${long(d.date)}: ${STATE_WORD[d.state]}, ${$(d.balance)}`}>
              <Icon name={ICON_FOR[d.state]} size={16} color={COLOR_FOR[d.state]} />
              <span className={'n' + (hot ? ' hot' : '')}>{d.date.getDate()}</span>
            </button>
          );
        })}
      </div>
      <div className="weeks">
        <span>Sep 28</span><span>Oct 5</span><span>Oct 12</span><span>Oct 19</span><span>Oct 26</span>
      </div>
    </div>
  );
}
function DayDetail({ sim, dayKey }) {
  const d = sim.days.find(x => x.key === dayKey); if (!d) return null;
  const morning = d.balance - d.events.reduce((a, e) => a + e.amt, 0);
  return (
    <div className="callout" style={{ flexDirection: 'column', gap: 6 }}>
      <div className="row between"><strong>{long(d.date)}</strong><span className={'pill ' + d.state}><Icon name={ICON_FOR[d.state]} size={13} />{STATE_WORD[d.state]}</span></div>
      <div className="row between muted"><span>Balance that morning</span><span className="num">{$(morning)}</span></div>
      {d.events.map((e, i) => <div className="row between" key={i}><span>{e.label}</span><span className={'num' + (e.amt > 0 ? ' in' : '')} style={{ color: e.amt > 0 ? 'var(--good)' : undefined }}>{e.amt > 0 ? '+' : ''}{$(e.amt)}</span></div>)}
      <div className="row between" style={{ fontWeight: 600 }}><span>End of day</span><span className="num">{$(d.balance)}</span></div>
    </div>
  );
}
function GoalBar({ saved, projected, target }) {
  return (
    <div className="bar" role="img" aria-label={`${$(saved)} saved, ${$(projected)} projected, of ${$(target)}`}>
      <i className="proj" style={{ width: Math.min(100, projected / target * 100) + '%' }}></i>
      <i style={{ width: Math.min(100, saved / target * 100) + '%' }}></i>
    </div>
  );
}
function Toggle({ on, onChange, children }) {

function ComparePanel({ sc, setSc, plan, cap, onApply, onClose }) {
  const [pick, setPick] = useState('keep');
  const [prot, setProt] = useState({ groceries: true });
  const base = goalAt(cap);
  // B: reduce an allowance the user hasn't protected
  const candidates = H.allowances.filter(a => !prot[a.id]).sort((a, b) => FLEX_ORDER.indexOf(a.id) - FLEX_ORDER.indexOf(b.id));
  let reduce = null;
  for (const a of candidates) { const cut = cutNeeded(sc, a.id, H.goal.planned); if (cut !== null && cut <= a.monthly) { reduce = { a, cut }; break; } }
  // C: review a renewal (gym renews Oct 15)
  const gym = H.recurring.find(r => r.id === 'gym'); const capNoGym = capacity({ ...sc, cancelled: { ...sc.cancelled, gym: true } });
  // D: later date
  const later = base.monthsNeeded;
  const options = [
    { id: 'keep', title: 'Keep everyday spending as it is', p: `Contribute ${$(cap)} a month instead of ${$(H.goal.planned)}.`, before: { k: 'Goal by ' + H.goal.targetLabel, v: $(H.goal.target) }, after: { k: 'Goal by ' + H.goal.targetLabel, v: $(base.projected), note: base.gap ? `${$(base.gap)} short` : 'on target' }, extra: `Checking stays above your ${$(H.cushion)} cushion.`, apply: { contribution: cap, label: `Plan set to ${$(cap)}/month` } },
    reduce ? { id: 'reduce', title: `Reduce ${reduce.a.label} by ${$(reduce.cut)} a month`, p: `${$(reduce.a.monthly)} → ${$(reduce.a.monthly - reduce.cut)}. Keeps the ${$(H.goal.planned)} contribution.`, before: { k: reduce.a.label, v: $(reduce.a.monthly) + '/mo' }, after: { k: 'Contribution', v: $(H.goal.planned), note: 'goal on target' }, extra: 'Only allowances you have not protected are offered.', apply: { cuts: { [reduce.a.id]: reduce.cut }, contribution: H.goal.planned, label: `${reduce.a.label} trimmed ${$(reduce.cut)}/month` } }
      : { id: 'reduce', title: 'Reduce an allowance', p: 'Every allowance is protected, so there is nothing to trim. Unprotect one to see this option.', disabled: true },
    { id: 'renewal', title: `Review the ${gym.label.toLowerCase()} renewal (${$(gym.amount)} on Oct 15)`, p: `If it is cancelled before it charges, the plan supports ${$(capNoGym)} a month.`, before: { k: 'Contribution', v: $(cap) }, after: { k: 'Contribution', v: $(Math.min(capNoGym, H.goal.planned)), note: 'if cancelled' }, extra: 'A scenario until the provider confirms the cancellation.', conditional: true, apply: { cancelled: { gym: true }, contribution: Math.min(capNoGym, H.goal.planned), label: 'Gym cancellation pending confirmation' } },
    { id: 'date', title: 'Move the target date', p: isFinite(later) ? `Keep ${$(cap)} a month and reach ${$(H.goal.target)} after ${later} contributions instead of ${H.goal.left}.` : 'The plan cannot support a contribution right now, so no date works yet.', before: { k: 'Target', v: H.goal.targetLabel }, after: { k: 'Target', v: isFinite(later) ? monthLabel(later) : '—', note: isFinite(later) ? `${later - H.goal.left} month${later - H.goal.left === 1 ? '' : 's'} later` : '' }, extra: 'Nothing else changes.', disabled: !isFinite(later), apply: { contribution: cap, label: `Target moved to ${isFinite(later) ? monthLabel(later) : '—'}` } },
  ];
  const chosen = options.find(o => o.id === pick);
  return (
    <div className="card">
      <div className="row between"><h2>Compare options</h2><button className="btn ghost sm" onClick={onClose} aria-label="Close"><Icon name="x" size={16} /></button></div>
      <p style={{ margin: 0 }}>The internet increase of <b className="num">{$(sc.increase)}</b> a month leaves your plan <b className="num">{base.gap ? $(base.gap) : '$0'}</b> short of {$(H.goal.target)}. Pick a response and preview it. Nothing moves until you confirm.</p>
      <div className="row wrap" style={{ gap: 12 }}>
        <span className="label">Protect</span>
        {H.allowances.map(a => <Toggle key={a.id} on={!!prot[a.id]} onChange={v => setProt(p => ({ ...p, [a.id]: v }))}>{a.label} {$(a.monthly)}</Toggle>)}
      </div>
      {options.map(o => (
        <div key={o.id} className={'option' + (pick === o.id ? ' on' : '')} style={{ opacity: o.disabled ? .6 : 1 }}>
          <div className="row between"><h3>{o.title}</h3>{o.conditional && <span className="pill neutral">Conditional</span>}</div>
          <p>{o.p}</p>
          {!o.disabled && <div className="ba"><div><span className="k">Before · {o.before.k}</span><b>{o.before.v}</b></div><div><span className="k">After · {o.after.k}</span><b>{o.after.v}</b><span className="fine">{o.after.note}</span></div></div>}
          {!o.disabled && <div className="row between"><span className="fine">{o.extra}</span><button className={'btn sm' + (pick === o.id ? '' : ' ghost')} onClick={() => setPick(o.id)}>{pick === o.id ? 'Selected' : 'Preview'}</button></div>}
        </div>
      ))}
      <div className="callout"><Icon name="umbrella" size={18} /><span>No option hides a cost. Moving money from savings would fix checking but shrink the goal, so it is not offered here.</span></div>
      <button className="btn" disabled={!chosen || chosen.disabled} onClick={() => onApply(chosen)}>Apply this plan <Icon name="arrow" size={16} /></button>
    </div>
  );
}

/* =============== app shell =============== */
function App() {
  const [page, setPage] = useState('forecast');
  const [panel, setPanel] = useState(null);         // 'bill' | 'compare' | null
  const [sc, setSc] = useState({ increase: 25, contribution: 300, cuts: {}, cancelled: {} });
  const [confirm, setConfirm] = useState(null);
  const [applied, setApplied] = useState(null);
  const [found, setFound] = useState(true);

  const sim = useMemo(() => simulate(sc), [sc]);
  const cap = useMemo(() => capacity(sc), [sc]);
  const goal = useMemo(() => {
    const c = applied ? sc.contribution : cap;
    const g = goalAt(c);
    return applied?.id === 'date' && isFinite(g.monthsNeeded) ? goalAt(c, g.monthsNeeded) : g;
  }, [sc, cap, applied]);

  const alerts = useMemo(() => {
    const a = []; const planFits = sc.contribution <= cap;
    if (sc.increase > 0 && !applied) a.push({
      title: `Your internet bill increased by ${$(sc.increase)}.`,
      body: `${!planFits ? `Your planned ${$(sc.contribution)} contribution would leave ${$(sim.low.balance)} on ${pretty(sim.low.date)}, below your ${$(H.cushion)} cushion. ` : ''}${goalAt(cap).gap ? `Your goal would end ${$(goalAt(cap).gap)} short. ` : ''}Review the effect on your goal.`,
      action: { label: 'Compare options', go: () => { setPage('forecast'); setPanel('compare'); } },
    });
    if (sim.worst === 'storm' || sim.worst === 'rain') a.push({ title: `Projected balance falls to ${$(sim.low.balance)} on ${pretty(sim.low.date)}.`, body: `That is below your ${$(H.cushion)} cushion before payday.` });
    return a;
  }, [sc, cap, sim, applied]);

  const open = ({ page: p, panel: pn }) => { if (p) setPage(p); if (pn !== undefined) setPanel(pn); };
  const apply = o => setConfirm(o);
  const reallyApply = () => { setSc(s => ({ ...s, ...confirm.apply, cuts: { ...s.cuts, ...(confirm.apply.cuts || {}) }, cancelled: { ...s.cancelled, ...(confirm.apply.cancelled || {}) } })); setApplied({ id: confirm.id, label: confirm.apply.label }); setConfirm(null); setPanel(null); };

  const Nav = ({ inline }) => (
    <>
      {[['forecast', 'Forecast', 'forecast'], ['activity', 'Activity', 'activity'], ['goals', 'Goals', 'goal']].map(([id, label, ic]) => (
        <button key={id} className={'navbtn' + (page === id ? ' on' : '')} onClick={() => { setPage(id); }}><Icon name={ic} size={18} />{label}</button>
      ))}
    </>
  );

  return (
    <div className="app">
      <nav aria-label="Main">
        <div className="logo"><Icon name="rain" size={26} color="var(--rain)" /><b>RainCheck</b></div>
        <Nav />
        <div className="navfoot">Alex's household · one checking, one savings, one goal.<br />Mock data from Capital One's Nessie sandbox.</div>
      </nav>
      <main>
        <div className="tabs"><Nav inline /></div>
        {page === 'forecast' && (panel ? (
          <div className="cols">
            <div className="stack">
              <button className="link" onClick={() => setPanel(null)} style={{ alignSelf: 'flex-start' }}>← Back to forecast</button>
              {panel === 'bill' && <BillPanel sc={sc} setSc={setSc} cap={cap} goal={goalAt(cap)} onCompare={() => setPanel('compare')} onClose={() => setPanel(null)} />}
              {panel === 'compare' && <ComparePanel sc={sc} setSc={setSc} cap={cap} onApply={apply} onClose={() => setPanel(null)} />}
            </div>
            <div className="stack">
              <section className={'hero ' + sim.worst}>
                <div className="row between wrap"><span className={'pill ' + sim.worst}><Icon name={ICON_FOR[sim.worst]} size={14} />Current plan · {$(sc.contribution)}/month</span><span className="fine">Lowest {$(sim.low.balance)} on {pretty(sim.low.date)}</span></div>
                <Strip sim={sim} selected={null} onSelect={() => {}} />
              </section>
              <div className="card"><h2>{H.goal.label}</h2><GoalBar saved={H.goal.saved} projected={goalAt(cap).projected} target={H.goal.target} /><div className="fine">Projected {$(goalAt(cap).projected)} of {$(H.goal.target)} at {$(cap)}/month. Actual savings stay at {$(H.savings)} until a transfer completes.</div></div>
            </div>
          </div>
        ) : <Forecast sc={sc} setSc={setSc} sim={sim} cap={cap} goal={goal} alerts={alerts} open={open} setOpen={open} applied={applied} found={found} setFound={setFound} />)}
        {page === 'goals' && <Goals sc={sc} cap={cap} goal={goal} sim={sim} applied={applied} setOpen={open} />}
        {page === 'activity' && <Activity sc={sc} setSc={setSc} />}
      </main>
      {confirm && (
        <div className="sheet-bg" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
          <div className="sheet">
            <h2 id="confirm-title">Apply this plan?</h2>
            <div className="option on"><h3>{confirm.title}</h3><p>{confirm.p}</p></div>
            <div className="callout"><Icon name="umbrella" size={18} /><span>This updates your plan. It does not move money. Your savings stay at {$(H.savings)} until you complete a transfer on the Goals page.</span></div>
            <div className="row" style={{ gap: 8 }}><button className="btn" onClick={reallyApply}><Icon name="check" size={16} />Apply</button><button className="btn ghost" onClick={() => setConfirm(null)}>Cancel</button></div>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
