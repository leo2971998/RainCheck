/* =============== sample household (Nessie would supply the records) =============== */
const TODAY = new Date(2026, 8, 28);

];

/* =============== helpers =============== */
const $ = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const $2 = n => (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const iso = d => d.toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

const monthLabel = n => MONTHS[Math.min(MONTHS.length, Math.max(1, n)) - 1];
const FLEX_ORDER = ['takeout', 'fun', 'rides', 'household', 'groceries'];

/* =============== engine =============== */
function simulate(sc) {
  const income = sc.income || H.income;
  const dailySpend = (H.allowances.reduce((a, x) => a + x.monthly - (sc.cuts?.[x.id] || 0), 0)) / 30;
  const days = []; let b = H.checking;
  for (let i = 0; i < WINDOW; i++) {
    const date = addDays(TODAY, i), key = iso(date), events = [];
    for (const p of income) if (p.date === key) { b += p.amount; events.push({ label: p.label.split(' · ')[0] + (p.status === 'estimated' ? ' (estimated)' : ''), amt: p.amount, pay: true }); }
    for (const r of H.recurring) {
      if (date.getDate() !== r.day || sc.cancelled?.[r.id]) continue;
      let amt = r.amount;
      if (r.change && key >= r.change.effective) amt = r.amount + sc.increase;
      if (r.id === 'electric' && sc.treatElectricAsNew) amt = r.lastPosted;
      b -= amt; events.push({ label: r.label.split(' · ')[0], amt: -amt, bill: true, big: amt >= 100 });
    }
    if (key === '2026-10-02' && sc.contribution > 0) { b -= sc.contribution; events.push({ label: 'Savings contribution', amt: -sc.contribution, transfer: true }); }
    b -= dailySpend; events.push({ label: 'Everyday spending', amt: -dailySpend });
    days.push({ date, key, balance: b, events, state: stateOf(b, H.cushion) });

  const low = days.reduce((a, x) => (x.balance < a.balance ? x : a));
  const worst = ['over', 'below', 'tight', 'ok'].find(s => days.some(d => d.state === s));
  const oct = days.filter(d => d.key >= '2026-10-01');

  return { days, low, worst, dailySpend, cash };
}
function capacity(sc) { for (let c = 600; c >= 0; c -= 5) if (simulate({ ...sc, contribution: c }).low.balance >= H.cushion) return c; return 0; }
function goalAt(c, left = H.goal.left) {
  const projected = H.goal.saved + left * c, gap = Math.max(0, H.goal.target - projected);
  const monthsNeeded = c > 0 ? Math.ceil((H.goal.target - H.goal.saved) / c) : Infinity;
  return { projected, gap, monthsNeeded, contributions: left * c, left, targetLabel: monthLabel(left) };
}
function cutNeeded(sc, id, want) { for (let cut = 0; cut <= 400; cut += 5) if (capacity({ ...sc, cuts: { ...sc.cuts, [id]: cut } }) >= want) return cut; return null; }

/* =============== icons =============== */

  const d = {

/* =============== charts (hand-drawn SVG) =============== */
function niceTicks(min, max, n = 4) { const span = max - min, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw); const out = []; for (let v = Math.ceil(min / step) * step; v <= max; v += step) out.push(v); return out; }
function AreaChart({ sim, id = 'a', height = 250 }) {
  const [hov, setHov] = useState(null);
  const days = sim.days, n = days.length, W = 920, Hh = height, L = 56, R = 18, T = 20, B = 30;
  const vals = days.map(d => d.balance); const maxV = Math.max(...vals, H.cushion) * 1.06; const minV = Math.min(0, ...vals) - 80;
  const x = i => L + (i / (n - 1)) * (W - L - R), y = v => T + (1 - (v - minV) / (maxV - minV)) * (Hh - T - B);
  const line = days.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d.balance).toFixed(1)}`).join(' ');
  const area = `${line} L${x(n - 1).toFixed(1)},${y(minV)} L${x(0)},${y(minV)} Z`;
  const ticks = niceTicks(Math.min(0, minV + 80), maxV);
  const lowI = days.indexOf(sim.low);
  const h = hov !== null ? days[hov] : null;
  const tipX = h ? Math.min(Math.max(x(hov) - 90, L), W - R - 190) : 0;
  return (
    <svg viewBox={`0 0 ${W} ${Hh}`} width="100%" style={{ display: 'block' }} onMouseLeave={() => setHov(null)} role="img" aria-label={`Projected checking balance over the next ${n} days; lowest ${$(sim.low.balance)} on ${pretty(sim.low.date)}`}>
      <defs><linearGradient id={'g' + id} x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="#4F46E5" stopOpacity=".26" /><stop offset="1" stopColor="#4F46E5" stopOpacity="0" /></linearGradient></defs>
      {ticks.map(t => <g key={t}><line x1={L} x2={W - R} y1={y(t)} y2={y(t)} stroke="#EEF0F6" /><text x={L - 8} y={y(t) + 4} textAnchor="end" fontSize="11" fill="#9CA3AF">{$(t)}</text></g>)}
      <line x1={L} x2={W - R} y1={y(H.cushion)} y2={y(H.cushion)} stroke="#D97706" strokeDasharray="5 5" strokeWidth="1.2" />
      <text x={W - R} y={y(H.cushion) - 6} textAnchor="end" fontSize="11" fill="#B45309" fontWeight="600">Cushion {$(H.cushion)}</text>
      {minV < 0 && <line x1={L} x2={W - R} y1={y(0)} y2={y(0)} stroke="#DC2626" strokeWidth="1" opacity=".6" />}
      <path d={area} fill={`url(#g${id})`} /><path d={line} fill="none" stroke="#4F46E5" strokeWidth="2.4" strokeLinejoin="round" />
      {days.map((d, i) => d.events.some(e => e.pay) ? <circle key={'p' + i} cx={x(i)} cy={y(d.balance)} r="4" fill="#0D9488" stroke="#fff" strokeWidth="1.5" /> : d.events.some(e => e.big) ? <circle key={'b' + i} cx={x(i)} cy={y(d.balance)} r="3.5" fill="#fff" stroke="#4F46E5" strokeWidth="1.8" /> : null)}
      <circle cx={x(lowI)} cy={y(sim.low.balance)} r="5" fill={sim.low.state === 'ok' ? '#16A34A' : sim.low.state === 'tight' ? '#D97706' : '#DC2626'} stroke="#fff" strokeWidth="2" />
      <text x={x(lowI)} y={y(sim.low.balance) + 18} textAnchor={lowI > n * 0.8 ? 'end' : 'middle'} fontSize="11.5" fontWeight="600" fill="#374151">Low {$(sim.low.balance)} · {pretty(sim.low.date)}</text>
      {days.map((d, i) => (i % 7 === 0 || i === n - 1) && <text key={'x' + i} x={x(i)} y={Hh - 8} textAnchor="middle" fontSize="11" fill="#9CA3AF">{pretty(d.date)}</text>)}
      {days.map((d, i) => <rect key={'h' + i} x={x(i) - (W - L - R) / (n - 1) / 2} y={T} width={(W - L - R) / (n - 1)} height={Hh - T - B} fill="transparent" onMouseEnter={() => setHov(i)} />)}
      {h && <g className="tip"><line x1={x(hov)} x2={x(hov)} y1={T} y2={Hh - B} stroke="#9CA3AF" strokeDasharray="3 3" /><circle cx={x(hov)} cy={y(h.balance)} r="4.5" fill="#4F46E5" stroke="#fff" strokeWidth="2" />
        <rect x={tipX} y={T + 2} width="190" height={30 + 15 * Math.min(4, h.events.length)} rx="8" fill="#111827" opacity=".94" />
        <text x={tipX + 10} y={T + 20} fontSize="12" fontWeight="700" fill="#fff">{pretty(h.date)} · {$(h.balance)}</text>
        {h.events.slice(0, 4).map((e, k) => <text key={k} x={tipX + 10} y={T + 35 + 15 * k} fontSize="11" fill="#C9CEE3">{e.label}: {e.amt > 0 ? '+' : ''}{$(e.amt)}</text>)}</g>}
    </svg>
  );
}
function GoalChart({ cap }) {
  const W = 420, Hh = 150, L = 44, R = 14, T = 14, B = 26; const months = ['Now', 'Oct', 'Nov', 'Dec', 'Jan'];
  const orig = [0, 1, 2, 3, 4].map(i => H.goal.saved + i * H.goal.planned), upd = [0, 1, 2, 3, 4].map(i => H.goal.saved + i * cap);
  const top = Math.max(2200, ...upd) * 1.05;
  const y = v => T + (1 - v / top) * (Hh - T - B), x = i => L + (i / 4) * (W - L - R);
  const pl = a => a.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y(v)}`).join(' ');
  return (
    <svg viewBox={`0 0 ${W} ${Hh}`} width="100%" role="img" aria-label="Goal projection, original plan versus updated plan">
      {[0, 1000, 2000].map(t => <g key={t}><line x1={L} x2={W - R} y1={y(t)} y2={y(t)} stroke="#EEF0F6" /><text x={L - 6} y={y(t) + 4} textAnchor="end" fontSize="10.5" fill="#9CA3AF">{$(t)}</text></g>)}
      <line x1={L} x2={W - R} y1={y(H.goal.target)} y2={y(H.goal.target)} stroke="#16A34A" strokeDasharray="4 4" />
      <path d={pl(orig)} fill="none" stroke="#C7CBE0" strokeWidth="2.2" strokeDasharray="6 4" /><path d={pl(upd)} fill="none" stroke="#4F46E5" strokeWidth="2.6" />
      {upd.map((v, i) => <circle key={i} cx={x(i)} cy={y(v)} r="3.5" fill="#4F46E5" stroke="#fff" strokeWidth="1.5" />)}
      {months.map((m, i) => <text key={m} x={x(i)} y={Hh - 8} textAnchor="middle" fontSize="11" fill="#9CA3AF">{m}</text>)}
      <text x={W - R} y={y(H.goal.target) - 5} textAnchor="end" fontSize="10.5" fill="#15803D" fontWeight="600">Target {$(H.goal.target)}</text>

  );
}

        <table><thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th className="r">Amount</th><th></th></tr></thead><tbody>
          {rows.map((t, i) => { const [ic, cls] = KIND_ICON[t.k]; return <tr key={i} className="hover"><td className="muted" style={{ whiteSpace: 'nowrap' }}>{t.d}</td><td><div className="cat"><i className={t.review ? 'rev' : cls}><I n={t.review ? 'warn' : ic} s={14} /></i><div><div style={{ fontWeight: 500 }}>{t.what}</div>{(t.note || t.review) && <div className="fine">{t.review || t.note}</div>}</div></div></td><td><span className={'pill ' + (t.review ? 'warn' : 'neutral')}>{t.review ? 'Needs review' : t.cat}</span></td><td className="r" style={{ fontWeight: 600, color: t.amt > 0 ? 'var(--good)' : undefined }}>{t.amt > 0 ? '+' : ''}{$2(t.amt)}</td><td className="r">{t.review && <button className="btn ghost sm">Fix category</button>}</td></tr>; })}
        </tbody></table>
      </div>
    </>
  );
}
function RecurringPage({ sc, setSc, open }) {
  const total = H.recurring.reduce((a, r) => a + (r.change ? r.amount + sc.increase : r.id === 'electric' && sc.treatElectricAsNew ? r.lastPosted : r.amount), 0);
  return (
    <>
      <div className="topbar"><div><h1>Recurring</h1><div className="sub">7 commitments · {$(total)} per month · 1 increase detected</div></div></div>
      <div className="grid g4" style={{ marginBottom: 18 }}>
        <Kpi label="Monthly recurring" value={$(total)} sub="Across 7 commitments" />
        <Kpi label="Due in the next 7 days" value={$(H.recurring.filter(r => r.day <= 5).reduce((a, r) => a + (r.change ? r.amount + sc.increase : r.amount), 0))} sub="Internet Oct 1 · Streaming Oct 3 · Rent Oct 5" />
        <Kpi label="Changes detected" value="1" sub="Internet · confirmed from a notice" pill={<span className="pill warn"><I n="up" s={11} />{$(sc.increase)}</span>} />
        <Kpi label="Unexplained" value="1" sub="Electric posted $128, usually $110" pill={<span className="pill neutral">Needs a decision</span>} />
      </div>
      <div className="card">
        <table><thead><tr><th>Commitment</th><th>Next</th><th>Frequency</th><th className="r">Amount</th><th>Status</th><th></th></tr></thead><tbody>
          {H.recurring.map(r => <tr key={r.id} className="hover">
            <td><div className="cat"><i className="rec"><I n="repeat" s={14} /></i><span style={{ fontWeight: 500 }}>{r.label}</span></div></td>
            <td>Oct {r.day}</td><td className="muted">{r.freq}</td>
            <td className="r">{r.change ? <><span className="muted" style={{ textDecoration: 'line-through' }}>{$(r.amount)}</span> <b>{$(r.amount + sc.increase)}</b></> : r.id === 'electric' && sc.treatElectricAsNew ? <b>{$(r.lastPosted)}</b> : $(r.amount)}</td>
            <td>{r.change ? <span className="pill warn"><I n="up" s={11} />Increase from notice</span> : r.unexplained ? <span className="pill neutral">Posted {$(r.lastPosted)} · not confirmed why</span> : sc.cancelled?.[r.id] ? <span className="pill accent">Cancel pending</span> : r.renews ? <span className="pill neutral">Renews Oct 15</span> : <span className="pill good">Steady</span>}</td>
            <td className="r">{r.change && <button className="btn sm" onClick={() => open('bill')}>Review</button>}{r.unexplained && <div className="row" style={{ justifyContent: 'flex-end', gap: 6 }}><button className={'btn sm' + (sc.treatElectricAsNew ? ' ghost' : '')} onClick={() => setSc(s => ({ ...s, treatElectricAsNew: false }))}>One-time</button><button className={'btn sm' + (sc.treatElectricAsNew ? '' : ' ghost')} onClick={() => setSc(s => ({ ...s, treatElectricAsNew: true }))}>New price</button></div>}</td>
          </tr>)}
        </tbody></table>
        <div className="fine">"The amount changed. We have not confirmed why." is an honest state. Your decision on Electric changes the forecast immediately.</div>
      </div>
    </>
  );
}
function CashFlowPage({ sc, sim }) {
  return (
    <>
      <div className="topbar"><div><h1>Cash flow</h1><div className="sub">Income against spending, with October projected from the forecast</div></div></div>
      <div className="grid g32">
        <div className="card"><div className="hd"><h2>Monthly</h2><div className="legend"><span><i style={{ background: 'var(--teal)' }}></i>Income</span><span><i style={{ background: '#C7CBE0' }}></i>Spending</span></div></div><CashBars sim={sim} /></div>
        <div className="card"><div className="hd"><h2>Everyday allowances</h2><span className="fine">Monthly, spread across days</span></div>
          {H.allowances.map(a => { const cut = sc.cuts?.[a.id] || 0; return <div className="hbar" key={a.id}><span>{a.label}</span><div className="t"><i className="cut" style={{ width: a.monthly / 700 * 100 + '%' }}></i><i style={{ width: (a.monthly - cut) / 700 * 100 + '%' }}></i></div><span className="num" style={{ textAlign: 'right' }}>{cut ? <><span className="muted" style={{ textDecoration: 'line-through' }}>{$(a.monthly)}</span> {$(a.monthly - cut)}</> : $(a.monthly)}</span></div>; })}
          <div className="fine">Learned from three months of transactions. Trimmed allowances show the old amount struck through.</div></div>
      </div>
    </>
  );
}
function GoalsPage({ sc, cap, goal, applied, open }) {
  const [tr, setTr] = useState(null);
  return (
    <>
      <div className="topbar"><div><h1>Goals</h1><div className="sub">Actual progress, contribution plan, and projected outcome</div></div><button className="btn ghost sm">+ New goal</button></div>
      <div className="grid g32">
        <div className="grid" style={{ gap: 18 }}>
          <div className="card">
            <div className="hd"><div className="cat"><i className="rec"><I n="shield" s={14} /></i><h2>{H.goal.label} · {$(H.goal.target)} by {goal.targetLabel}</h2></div><span className={'pill ' + (goal.gap ? 'bad' : 'good')}>{goal.gap ? `${$(goal.gap)} short` : 'On track'}</span></div>
            <div className="progress"><i className="proj" style={{ width: Math.min(100, goal.projected / H.goal.target * 100) + '%' }}></i><i className="saved" style={{ width: H.goal.saved / H.goal.target * 100 + '%' }}></i></div>
            <div className="row between fine"><span><span className="dot" style={{ background: 'var(--accent)' }}></span> Saved {$(H.goal.saved)}</span><span><span className="dot" style={{ background: '#C7CBE0' }}></span> Projected {$(goal.projected)}</span><span>Target {$(H.goal.target)}</span></div>
            <GoalChart cap={applied ? sc.contribution : cap} />
            <table><thead><tr><th>Plan</th><th className="r">Original</th><th className="r">Updated</th></tr></thead><tbody>
              <tr><td>Already saved</td><td className="r">{$(H.goal.saved)}</td><td className="r">{$(H.goal.saved)}</td></tr>
              <tr><td>Required contribution for the date</td><td className="r">{$((H.goal.target - H.goal.saved) / H.goal.left)}</td><td className="r">{$((H.goal.target - H.goal.saved) / H.goal.left)}</td></tr>
              <tr><td>Contribution the plan can support</td><td className="r">{$(H.goal.planned)}</td><td className="r"><b>{$(cap)}</b></td></tr>
              <tr><td>{goal.left} future contributions</td><td className="r">{$(H.goal.planned * H.goal.left)}</td><td className="r">{$(goal.contributions)}</td></tr>
              <tr><td>Projected balance</td><td className="r">{$(H.goal.target)}</td><td className="r"><b>{$(goal.projected)}</b></td></tr>
              <tr><td>Gap at target date</td><td className="r">$0</td><td className="r"><b style={{ color: goal.gap ? 'var(--bad)' : 'var(--good)' }}>{$(goal.gap)}</b></td></tr>
            </tbody></table>
            <div className="row" style={{ gap: 8 }}><button className="btn" onClick={() => open('compare')}>Compare options</button>{applied && <span className="pill good"><I n="check" s={11} />{applied.label}</span>}</div>
          </div>
        </div>
        <div className="grid" style={{ gap: 18 }}>
          <div className="card"><div className="hd"><h2>Savings account</h2><span className="pill teal">Nessie</span></div><div className="row between"><span className="muted">Actual balance</span><b className="num" style={{ fontSize: 22, fontFamily: 'var(--display)' }}>{$(H.savings + (tr === 'done' ? sc.contribution : 0))}</b></div><div className="fine">Counted toward one goal. Accepting a plan never moves money.</div>
            {tr === null && <button className="btn ghost" onClick={() => setTr('pending')}>Move {$(sc.contribution)} to savings (sandbox)</button>}
            {tr === 'pending' && <div className="alert"><b>Transfer requested</b><p>Waiting to read back its status from the sandbox before showing it as complete.</p><div><button className="btn sm" onClick={() => setTr('done')}>Read back status</button></div></div>}
            {tr === 'done' && <span className="pill good"><I n="check" s={11} />Completed · confirmed by the sandbox</span>}</div>
          <div className="card"><h2>Contribution schedule</h2><table><tbody>{H.goal.months.map((m, i) => <tr key={m}><td style={{ paddingLeft: 0 }} className="muted">{m}</td><td>Contribution {i + 1} of {goal.left}</td><td className="r" style={{ paddingRight: 0 }}><b>{$(sc.contribution)}</b></td></tr>)}</tbody></table></div>
          <div className="card"><h2>Cushion</h2><div className="row between"><span className="muted">Keep checking above</span><b className="num">{$(H.cushion)}</b></div><div className="fine">Every status on the dashboard comes from this number and the projected balance.</div></div>
        </div>
      </div>
    </>
  );
}

/* =============== drawers =============== */
function BillDrawer({ sc, setSc, cap, onCompare, onClose }) {
  const r = H.recurring.find(x => x.id === 'internet'); const inc = sc.increase; const g = goalAt(cap);
  return (
    <div className="drawer-bg" onClick={onClose}><div className="drawer" onClick={e => e.stopPropagation()} role="dialog" aria-modal="true" aria-label="Bill change details">
      <div className="row between"><div className="cat"><i className="rec"><I n="repeat" s={14} /></i><h2>{r.label}</h2></div><button className="btn ghost sm" onClick={onClose} aria-label="Close"><I n="x" s={16} /></button></div>
      <div className="row wrap" style={{ gap: 6 }}><span className="pill warn"><I n="up" s={11} />Upcoming increase</span><span className="pill good"><I n="check" s={11} />Confirmed from a notice</span></div>
      <div className="kv"><span className="k">Previous recurring amount</span><span className="v">{$(r.amount)}/month</span><span className="k">New recurring amount</span><span className="v">{$(r.amount + inc)}/month</span><span className="k">Increase</span><span className="v" style={{ fontWeight: 700 }}>{$(inc)}/month</span><span className="k">Explanation</span><span className="v">{r.change.why}</span><span className="k">Next affected payment</span><span className="v">October 1</span></div>
      <h3>Evidence</h3>
      <div className="notice">{NOTICE.split('\n').map((line, i) => { const hit = /renew at \$90\.00 starting with your October 1 bill/.test(line) || /promotional credit of \$25\.00 ended/.test(line); return <div key={i}>{hit ? <mark>{line}</mark> : (line || ' ')}</div>; })}</div>
      <div className="fine">A price change, not higher usage, a longer billing period, or a one-time fee. The next posted charge will confirm it.</div>
      <h3>What it changes in your plan</h3>
      <div className="ba"><div><span className="k">Supported contribution</span><b>{$(cap)}</b><span className="fine">was {$(H.goal.planned)}</span></div><div><span className="k">Goal at target date</span><b>{$(g.projected)}</b><span className="fine">{g.gap ? `${$(g.gap)} short of ${$(H.goal.target)}` : 'on target'}</span></div></div>
      <h3>For the judges: change the increase</h3>
      <div className="row"><span className="muted">Increase of</span><input type="number" min="0" step="5" value={inc} onChange={e => setSc(s => ({ ...s, increase: Math.max(0, Number(e.target.value) || 0) }))} aria-label="Increase amount" /><span className="muted">per month. Everything recomputes.</span></div>
      <div className="row wrap" style={{ gap: 8 }}><button className="btn" onClick={onCompare}>Compare options <I n="arrow" s={15} /></button><button className="btn ghost sm"><I n="mail" s={14} />View notice</button><button className="btn ghost sm"><I n="ext" s={14} />Provider support</button><button className="btn ghost sm">Prepare a question</button></div>
      <div className="fine">RainCheck does not promise to negotiate this, and does not call every increase an error.</div>
    </div></div>
  );
}
function CompareDrawer({ sc, cap, onApply, onClose }) {
  const [pick, setPick] = useState('keep'); const [prot, setProt] = useState({ groceries: true });
  const base = goalAt(cap);
  const cands = H.allowances.filter(a => !prot[a.id]).sort((a, b) => FLEX_ORDER.indexOf(a.id) - FLEX_ORDER.indexOf(b.id));
  let reduce = null; for (const a of cands) { const cut = cutNeeded(sc, a.id, H.goal.planned); if (cut !== null && cut <= a.monthly) { reduce = { a, cut }; break; } }
  const gym = H.recurring.find(r => r.id === 'gym'); const capNoGym = capacity({ ...sc, cancelled: { ...sc.cancelled, gym: true } }); const later = base.monthsNeeded;
  const options = [
    { id: 'keep', title: 'Keep everyday spending as it is', p: `Contribute ${$(cap)} a month instead of ${$(H.goal.planned)}.`, b: ['Goal by ' + H.goal.targetLabel, $(H.goal.target)], a: ['Goal by ' + H.goal.targetLabel, $(base.projected), base.gap ? `${$(base.gap)} short` : 'on target'], x: `Checking stays above the ${$(H.cushion)} cushion.`, apply: { contribution: cap, label: `Plan set to ${$(cap)}/month` } },
    reduce ? { id: 'reduce', title: `Reduce ${reduce.a.label.toLowerCase()} by ${$(reduce.cut)} a month`, p: `${$(reduce.a.monthly)} → ${$(reduce.a.monthly - reduce.cut)}. Keeps the ${$(H.goal.planned)} contribution.`, b: [reduce.a.label, $(reduce.a.monthly) + '/mo'], a: ['Contribution', $(H.goal.planned), 'goal on target'], x: 'Only allowances you have not protected are offered.', apply: { cuts: { [reduce.a.id]: reduce.cut }, contribution: H.goal.planned, label: `${reduce.a.label} trimmed ${$(reduce.cut)}/month` } }
      : { id: 'reduce', title: 'Reduce an allowance', p: 'Every allowance is protected, so there is nothing to trim.', disabled: true },
    { id: 'renewal', title: `Review the gym renewal (${$(gym.amount)} on Oct 15)`, p: `If cancelled before it charges, the plan supports ${$(capNoGym)} a month.`, b: ['Contribution', $(cap)], a: ['Contribution', $(Math.min(capNoGym, H.goal.planned)), 'if cancelled'], x: 'A scenario until the provider confirms.', cond: true, apply: { cancelled: { gym: true }, contribution: Math.min(capNoGym, H.goal.planned), label: 'Gym cancellation pending' } },
    { id: 'date', title: 'Move the target date', p: isFinite(later) ? `Keep ${$(cap)} a month and reach ${$(H.goal.target)} after ${later} contributions instead of ${H.goal.left}.` : 'No contribution is supported right now.', b: ['Target', H.goal.targetLabel], a: ['Target', isFinite(later) ? monthLabel(later) : '—', isFinite(later) ? `${later - H.goal.left} month${later - H.goal.left === 1 ? '' : 's'} later` : ''], x: 'Nothing else changes.', disabled: !isFinite(later), apply: { contribution: cap, label: `Target moved to ${isFinite(later) ? monthLabel(later) : '—'}` } },
  ];
  const chosen = options.find(o => o.id === pick);
  return (
    <div className="drawer-bg" onClick={onClose}><div className="drawer" onClick={e => e.stopPropagation()} role="dialog" aria-modal="true" aria-label="Compare options">
      <div className="row between"><h2>Compare options</h2><button className="btn ghost sm" onClick={onClose} aria-label="Close"><I n="x" s={16} /></button></div>
      <p style={{ margin: 0, color: 'var(--ink-2)' }}>The {$(sc.increase)} increase leaves your plan <b className="num">{base.gap ? $(base.gap) : '$0'}</b> short of {$(H.goal.target)}. Preview a response. Nothing moves until you confirm.</p>
      <div><h3 style={{ marginBottom: 8 }}>Protect</h3><div className="row wrap" style={{ gap: 12 }}>{H.allowances.map(a => <Toggle key={a.id} on={!!prot[a.id]} onChange={v => setProt(p => ({ ...p, [a.id]: v }))}>{a.label}</Toggle>)}</div></div>
      {options.map(o => <div key={o.id} className={'option' + (pick === o.id ? ' on' : '')} style={{ opacity: o.disabled ? .6 : 1 }}>
        <div className="row between"><h3>{o.title}</h3>{o.cond && <span className="pill neutral">Conditional</span>}</div><p>{o.p}</p>
        {!o.disabled && <div className="ba"><div><span className="k">Before · {o.b[0]}</span><b>{o.b[1]}</b></div><div><span className="k">After · {o.a[0]}</span><b>{o.a[1]}</b><span className="fine">{o.a[2]}</span></div></div>}
        {!o.disabled && <div className="row between"><span className="fine">{o.x}</span><button className={'btn sm' + (pick === o.id ? '' : ' ghost')} onClick={() => setPick(o.id)}>{pick === o.id ? 'Selected' : 'Preview'}</button></div>}
      </div>)}
      <div className="alert good"><b>No option hides a cost.</b><p>Moving money from savings would fix checking but shrink the goal, so it is not offered here.</p></div>
      <button className="btn" disabled={!chosen || chosen.disabled} onClick={() => onApply(chosen)}>Apply this plan <I n="arrow" s={15} /></button>
    </div></div>
  );
}

/* =============== shell =============== */
function App() {
  const [page, setPage] = useState('dashboard');
  const [drawer, setDrawer] = useState(null);
  const [sc, setSc] = useState({ increase: 25, contribution: 300, cuts: {}, cancelled: {} });
  const [confirm, setConfirm] = useState(null);
  const [applied, setApplied] = useState(null);
  const [found, setFound] = useState(true);
  const sim = useMemo(() => simulate(sc), [sc]);
  const cap = useMemo(() => capacity(sc), [sc]);
  const goal = useMemo(() => { const c = applied ? sc.contribution : cap; const g = goalAt(c); return applied?.id === 'date' && isFinite(g.monthsNeeded) ? goalAt(c, g.monthsNeeded) : g; }, [sc, cap, applied]);
  const open = what => what.startsWith('page:') ? setPage(what.slice(5)) : setDrawer(what);
  const alerts = useMemo(() => {
    const a = []; const fits = sc.contribution <= cap; const g = goalAt(cap);
    if (sc.increase > 0 && !applied) a.push({ tone: 'warn', title: `Your internet bill increased by ${$(sc.increase)}.`, body: `${!fits ? `Your planned ${$(sc.contribution)} contribution would leave ${$(sim.low.balance)} on ${pretty(sim.low.date)}, below your ${$(H.cushion)} cushion. ` : ''}${g.gap ? `Your goal would end ${$(g.gap)} short. ` : ''}Review the effect on your goal.`, actions: [{ label: 'See what changed', go: () => setDrawer('bill') }, { label: 'Compare options', primary: true, go: () => setDrawer('compare') }] });
    if (sim.worst === 'over' || sim.worst === 'below') a.push({ tone: 'bad', title: `Projected balance falls to ${$(sim.low.balance)} on ${pretty(sim.low.date)}.`, body: `That is below your ${$(H.cushion)} cushion before payday.` });
    if (applied) a.push({ tone: 'good', title: 'Plan updated.', body: `${applied.label}. Nothing was transferred; complete it on the Goals page when you are ready.` });
    return a;
  }, [sc, cap, sim, applied]);
  const reallyApply = () => { setSc(s => ({ ...s, ...confirm.apply, cuts: { ...s.cuts, ...(confirm.apply.cuts || {}) }, cancelled: { ...s.cancelled, ...(confirm.apply.cancelled || {}) } })); setApplied({ id: confirm.id, label: confirm.apply.label }); setConfirm(null); setDrawer(null); };
  const NAV = [['dashboard', 'Dashboard', 'dash'], ['forecast', 'Forecast', 'trend'], ['transactions', 'Transactions', 'list'], ['recurring', 'Recurring', 'repeat'], ['cashflow', 'Cash flow', 'bars'], ['goals', 'Goals', 'target']];
  const Nav = () => NAV.map(([id, l, ic]) => <button key={id} className={'nav' + (page === id ? ' on' : '')} onClick={() => setPage(id)}><I n={ic} s={17} />{l}{id === 'recurring' && <span className="badge">1</span>}{id === 'transactions' && <span className="badge">2</span>}</button>);
  return (
    <div className="app">
      <aside>
        <div className="brand"><span className="mark"><I n="spark" s={16} c="#fff" /></span><b>RainCheck</b></div>
        <Nav />
        <div className="side-foot"><div className="acct"><span className="avatar">A</span>Alex Rivera</div>Everyday Checking · Savings<br />Mock data · Capital One Nessie sandbox</div>
      </aside>
      <main>
        <div className="tabs"><Nav /></div>
        {page === 'dashboard' && <Dashboard sc={sc} setSc={setSc} sim={sim} cap={cap} goal={goal} alerts={alerts} open={open} applied={applied} found={found} setFound={setFound} />}
        {page === 'forecast' && <ForecastPage sc={sc} setSc={setSc} sim={sim} cap={cap} />}
        {page === 'transactions' && <TransactionsPage />}
        {page === 'recurring' && <RecurringPage sc={sc} setSc={setSc} open={open} />}
        {page === 'cashflow' && <CashFlowPage sc={sc} sim={sim} />}
        {page === 'goals' && <GoalsPage sc={sc} cap={cap} goal={goal} applied={applied} open={open} />}
      </main>
      {drawer === 'bill' && <BillDrawer sc={sc} setSc={setSc} cap={cap} onCompare={() => setDrawer('compare')} onClose={() => setDrawer(null)} />}
      {drawer === 'compare' && <CompareDrawer sc={sc} cap={cap} onApply={o => setConfirm(o)} onClose={() => setDrawer(null)} />}
      {confirm && <div className="modal-bg" role="dialog" aria-modal="true" aria-labelledby="ct"><div className="modal"><h2 id="ct">Apply this plan?</h2><div className="option on"><h3>{confirm.title}</h3><p>{confirm.p}</p></div><div className="alert"><b>This updates your plan. It does not move money.</b><p>Savings stay at {$(H.savings)} until you complete a transfer on the Goals page.</p></div><div className="row" style={{ gap: 8 }}><button className="btn" onClick={reallyApply}><I n="check" s={15} />Apply</button><button className="btn ghost" onClick={() => setConfirm(null)}>Cancel</button></div></div></div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
